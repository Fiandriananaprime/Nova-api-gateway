    PlatformSettings:
      type: object
      properties:
        platformName:
          type: string
        commissionRate:
          type: number
          minimum: 0
          maximum: 100
        defaultDeliveryFee:
          type: number
          minimum: 0
        maintenanceMode:
          type: boolean
        allowNewRegistrations:
          type: boolean
        allowNewSellerApplications:
          type: boolean
        requireProductModeration:
          type: boolean
        requireSellerApproval:
          type: boolean
        defaultLanguage:
          $ref: '#/components/schemas/Lang'
        timezone:
          type: string
    OrderTrackingStreamEvent:
      type: object
      required:
      - type
      - orderId
      - timestamp
      properties:
        type:
          type: string
          enum:
          - location_updated
          - status_changed
          - event_created
        orderId:
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatus'
          nullable: true
        location:
          $ref: '#/components/schemas/TrackingPoint'
          nullable: true
        event:
          $ref: '#/components/schemas/DeliveryEvent'
          nullable: true
        timestamp:
          type: string
          format: date-time
    RefundRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: number
          minimum: 0
        reason:
          type: string
    ReviewModerationRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - published
          - hidden
        reason:
          type: string
          nullable: true
    CategoryInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
    AdminReport:
      type: object
      properties:
        period:
          type: string
        orders:
          type: integer
        revenue:
          type: number
        buyers:
          type: integer
        sellers:
          type: integer
        products:
          type: integer
        deliveredOrders:
          type: integer
        cancelledOrders:
          type: integer
        lowStockProducts:
          type: integer
        pendingSellerApplications:
          type: integer
        pendingProductModeration:
          type: integer
    AuthRefreshResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        expiresAt:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Authentication required or token invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409': {description: Email already in use}
        '422': {$ref: '#/components/responses/ValidationError'}
      security: []
  
  /auth/register/seller:
    post:
      tags: [Auth]
      summary: Submit seller application
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SellerApplication'}
      responses:
        '201':
          description: Seller application submitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SellerApplication'}
        '409': {description: Email already in use}
        '422': {$ref: '#/components/responses/ValidationError'}

  /auth/login:
    post:
      tags: [Auth]
      summary: Login as buyer, seller or admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
          headers:
            Set-Cookie:
              description: Sets access_token and refresh_token as Secure, HttpOnly cookies. remember=true may extend 
                refresh lifetime.
              schema:
                type: array
                items:
                  type: string
        '401': {$ref: '#/components/responses/Unauthorized'}

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '202': {description: Password reset request accepted}

  /auth/email/send-verification:
    post:
      tags:
        - Auth
      summary: Resend email verification code
      description: Resends a verification code to the specified email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '204':
          description: Verification code sent successfully
        '400':
          description: Invalid email address
        '404':
          description: User not found
        '409':
          description: Email already verified
        '429':
          description: Too many verification code requests

  /auth/email/verify:
    post:
      tags: [Auth]
      summary: Verify email address
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerificationCodeRequest'}
      responses:
        '204': {description: Email verified}
        '400': {description: Invalid or expired verification code}
      x-csrf-required: true
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'



  /auth/phone/send-verification:
    post:
      tags: [Auth]
      summary: Send phone verification code
      responses:
        '204': {description: Verification sent}

  /auth/phone/verify:
    post:
      tags: [Auth]
      summary: Verify phone number
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerificationCodeRequest'}
      responses:
        '204': {description: Phone verified}
        '400': {description: Invalid or expired verification code}
      x-csrf-required: true
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'




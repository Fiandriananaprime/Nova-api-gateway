        '200':
          description: Related products
          content:
            application/json:
              schema:
                type: object
                properties:
                  sameCategory:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
                  sameSeller:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}


x-authentication:
  type: cookie
  accessCookie: access_token
  refreshCookie: refresh_token
  csrfHeader: X-CSRF-Token
  cookieRequirements:
  - Secure
  - HttpOnly
  - SameSite=Lax or Strict
  - short-lived access token
  - rotated refresh token
  notes: Do not store access or refresh tokens in localStorage/sessionStorage. The frontend must send credentials with 
    requests when using a separate origin.
x-realtime:
  orderTracking: GET /orders/{id}/tracking followed by GET /orders/{id}/tracking/stream (SSE)
  deliveryLocation: POST /delivery/orders/{id}/location
  platformEvents: GET /admin/events/stream (SSE)
  eventPayload: '#/components/schemas/OrderTrackingStreamEvent'
x-rbac:
  buyer: Customer shopping, checkout, orders and reviews
  seller: Store and own catalog/inventory/order operations
  moderator: Product moderation and physical inventory audits; cannot delete products
  delivery: Assigned deliveries, status changes and GPS location publication
  admin: Platform supervision, seller-application approval, global monitoring and operational moderation
  super_admin: All admin capabilities plus creation/suspension of admin, moderator and delivery accounts and platform 
    settings

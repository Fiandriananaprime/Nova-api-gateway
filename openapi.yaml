    get:
      tags: [Catalog]
      summary: List featured products
      security: []
      responses:
        '200':
          description: Featured products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 8
                    items: {$ref: '#/components/schemas/ProductSummary'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}

  /products/{id}:
    get:
      tags: [Catalog]
      summary: Product details

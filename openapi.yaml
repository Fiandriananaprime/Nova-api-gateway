    TrackingPoint:
      type: object
      required:
      - latitude
      - longitude
      - timestamp
      properties:
        id:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        accuracy:
          type: number
          minimum: 0
          nullable: true
          description: GPS accuracy in meters.
        speed:
          type: number
          minimum: 0
          nullable: true
          description: Current speed in m/s.
        heading:
          type: number
          minimum: 0
          maximum: 360
          nullable: true
          description: Heading in degrees.
    DeliveryStatus:
      type: string
      enum:
      - pending
      - preparing
      - processing
      - delivered
      - cancelled
      - failed
      description: Delivery lifecycle. pending can also represent a temporary delay such as traffic; use pendingReason 
        to explain why.
    DeliveryPendingReason:
      type: string
      enum:
      - traffic
      - waiting_seller
      - waiting_buyer
      - vehicle_issue
      - weather
      - other
    DeliveryEventType:
      type: string
      enum:
      - assigned
      - status_changed
      - vehicle_loaded
      - delivery_started
      - location_updated
      - traffic_delay
      - vehicle_issue
      - arrived
      - delivery_completed
      - delivery_failed
      - note
    DeliveryEvent:
      type: object
      required:
      - id
      - orderId
      - type
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
        deliveryId:
          type: string
          format: uuid
          nullable: true
        actorId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/DeliveryEventType'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
          nullable: true
        pendingReason:
          $ref: '#/components/schemas/DeliveryPendingReason'
          nullable: true
        message:
          type: string
          nullable: true
        location:
          $ref: '#/components/schemas/TrackingPoint'
          nullable: true
        createdAt:
          type: string
          format: date-time
    DeliveryTracking:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        pendingReason:
          $ref: '#/components/schemas/DeliveryPendingReason'
          nullable: true
        currentLocation:
          $ref: '#/components/schemas/TrackingPoint'
          nullable: true
        estimatedDelivery:
          type: string
          format: date-time
          nullable: true
        driver:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            phone:
              type: string
              nullable: true
            vehicle:
              type: string
              nullable: true
        updatedAt:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: '#/components/schemas/TrackingPoint'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryEvent'
    DeliveryLocationUpdate:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy:
          type: number
          minimum: 0
          nullable: true
        speed:
          type: number
          minimum: 0
          nullable: true
        heading:
          type: number
          minimum: 0
          maximum: 360
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
    DeliveryStatusUpdate:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        pendingReason:
          $ref: '#/components/schemas/DeliveryPendingReason'
          nullable: true
        message:
          type: string
          nullable: true
    DeliveryAssignment:
      type: object
      required:
      - deliveryId
      properties:
        deliveryId:
          type: string
          format: uuid
    DeliveryAgent:
      type: object
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - available
          - busy
          - offline
          - suspended
        vehicle:
          type: string
          nullable: true
        lastLocation:
          $ref: '#/components/schemas/TrackingPoint'
          nullable: true
    ProductModerationRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - approved
          - rejected
        reason:
          type: string
          nullable: true
    InventoryAudit:
      type: object
      required:
      - id
      - productId
      - expectedStock
      - countedStock
      - difference
      - moderatorId
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        expectedStock:
          type: integer
        countedStock:
          type: integer
          minimum: 0
        difference:
          type: integer
        reason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        moderatorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    InventoryAuditRequest:
      type: object
      required:
      - countedStock
      properties:
        countedStock:
          type: integer
          minimum: 0
        reason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    PlatformEventActorType:
      type: string
      enum:
      - buyer
      - seller
      - moderator
      - delivery
      - admin
      - super_admin
      - system
    PlatformEvent:
      type: object
      required:
      - id
      - actorType
      - eventType
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
        actorName:
          type: string
          nullable: true
        actorType:
          $ref: '#/components/schemas/PlatformEventActorType'
        eventType:
          type: string
          example: order_status_changed
        resourceType:
          type: string
          example: order
        resourceId:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    AdminEventFilters:
      type: object
      properties:
        actorType:
          $ref: '#/components/schemas/PlatformEventActorType'
        eventType:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        actorId:
          type: string
          format: uuid
        dateFrom:
          type: string
          format: date-time
        dateTo:
          type: string
          format: date-time
    CreateAdminRequest:
      type: object
      required:
      - firstName
      - lastName
      - email
      - password
      - adminRole
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        adminRole:
          type: string
          enum:

              month: {type: string}
              mvola: {type: number}
              orangeMoney: {type: number}
              card: {type: number}
              cod: {type: number}

    AdminSettings:
      type: object
      properties:
        theme: {$ref: '#/components/schemas/Theme'}
        lang: {$ref: '#/components/schemas/Lang'}
        emailNotifications: {type: boolean}
        pushNotifications: {type: boolean}
        securityAlerts: {type: boolean}

    AdminNotificationPrefs:
      type: object
      properties:
        sellerApplications: {type: boolean}
        productModeration: {type: boolean}
        paymentFailures: {type: boolean}
        fraudAlerts: {type: boolean}

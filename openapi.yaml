openapi: 3.0.3
info:
  title: Nova Market API
  description: >-
    OpenAPI specification for the Nova Market Malagasy multi-vendor marketplace. Covers authentication with secure HttpOnly
    cookies, buyer, seller, moderator, delivery, admin and super-admin portals, catalog, commerce, payments, payouts, notifications,
    real-time order tracking, inventory auditing, moderation, platform events and audit logs.
  version: 3.0.0
  contact:
    name: Nova Market Engineering
    email: dev@novamarket.mg
  license:
    name: Proprietary

servers:
- url: https://api.novamarket.mg/v2
  description: Production
- url: https://staging-api.novamarket.mg/v2
  description: Staging
- url: http://localhost:4000/v2
  description: Local development

tags:
- name: Auth
  description: Authentication, registration, verification and password recovery
- name: Account
  description: Shared account profile, security, sessions, privacy and notifications
- name: Catalog
  description: Public categories, products and stores
- name: Buyer - Cart
  description: Authenticated buyer cart
- name: Buyer - Checkout & Orders
  description: Buyer checkout and orders
- name: Buyer - Favorites
  description: Buyer favorites and followed stores
- name: Buyer - Profile & Settings
  description: Buyer profile, addresses, payment methods and preferences
- name: Buyer - Reviews
  description: Product reviews written by buyers
- name: Seller - Profile & Settings
  description: Seller account, business, verification and preferences
- name: Seller - Dashboard
  description: Seller KPIs and dashboard
- name: Seller - Products
  description: Seller product catalog management
- name: Seller - Inventory
  description: Seller inventory management
- name: Seller - Orders
  description: Seller order management
- name: Seller - Analytics
  description: Seller analytics
- name: Seller - Reviews
  description: Seller review management
- name: Seller - Promotions
  description: Seller promotions
- name: Seller - Store
  description: Seller store settings and store management
- name: Seller - Customers
  description: Seller customers
- name: Seller - Payments & Payouts
  description: Seller balances, payout methods and payout history
- name: Seller - Shipping
  description: Seller shipping settings
- name: Admin - Dashboard
  description: Platform dashboard
- name: Admin - Users
  description: User management
- name: Admin - Seller Applications
  description: Seller applications and KYC review
- name: Admin - Products
  description: Product moderation
- name: Admin - Categories
  description: Category management
- name: Admin - Orders
  description: Global order management
- name: Admin - Payments
  description: Platform transactions and refunds
- name: Admin - Promotions
  description: Global promotion moderation
- name: Admin - Reviews
  description: Review moderation
- name: Admin - Settings
  description: Admin account settings
- name: Admin - Platform Settings
  description: Global marketplace configuration
- name: Admin - Reports
  description: Platform reports and analytics
- name: Admin - Audit Logs
  description: Administrative audit trail

- name: Delivery
  description: Delivery agent operations, status updates and real-time location tracking
- name: Moderator - Products
  description: Product moderation by moderators; moderators cannot delete products
- name: Moderator - Inventory
  description: Inventory audits and stock verification; no product deletion
- name: Admin - Events
  description: Global activity stream for buyers, sellers, moderators and delivery agents
- name: Admin - Admin Accounts
  description: Administration of admin, moderator and delivery accounts
security:
- cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Secure, HttpOnly access-token cookie. Sent automatically by the browser over HTTPS.
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Secure, HttpOnly refresh-token cookie used only by POST /auth/refresh.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token required for authenticated state-changing requests.
  parameters:
    PageParam:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    LimitParam:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    SearchParam:
      name: search
      in: query
      schema: {type: string}
    IdParam:
      name: id
      in: path
      required: true
      schema: {type: string}
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token returned by GET /auth/csrf.
      schema:
        type: string
    DateFromParam:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date-time
    DateToParam:
      name: dateTo
      in: query
      schema:
        type: string
        format: date-time

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: VALIDATION_ERROR}
            message: {type: string, example: The email field is invalid.}
            details:
              type: array
              items:
                type: object
                properties:
                  field: {type: string}
                  message: {type: string}

    PaginationMeta:
      type: object
      properties:
        page: {type: integer, example: 1}
        limit: {type: integer, example: 20}
        total: {type: integer, example: 96}
        totalPages: {type: integer, example: 5}

    Lang:
      type: string
      enum: [mg, fr, en]

    UserRole:
      type: string
      enum:
      - buyer
      - seller
      - admin

    UserStatus:
      type: string
      enum: [active, suspended]

    AdminRole:
      type: string
      enum: [super_admin, admin, moderator, delivery]

    Theme:
      type: string
      enum: [light, dark, system]

    Address:
      type: object
      properties:
        id: {type: string, format: uuid}
        label: {type: string, example: Home}
        recipientName: {type: string, example: Rakoto Andry}
        phone: {type: string, example: '+261341234567'}
        street: {type: string}
        district: {type: string}
        city: {type: string, example: Antananarivo}
        region: {type: string, example: Analamanga}
        postalCode: {type: string, nullable: true, example: '101'}
        latitude: {type: number, nullable: true}
        longitude: {type: number, nullable: true}
        instructions: {type: string, nullable: true}
        isDefault: {type: boolean, default: false}

    User:
      type: object
      required: [id, firstName, lastName, email, role, status]
      properties:
        id: {type: string, format: uuid}
        firstName: {type: string, example: Rakoto}
        lastName: {type: string, example: Andry}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
        avatarUrl: {type: string, nullable: true}
        emailVerified: {type: boolean, default: false}
        phoneVerified: {type: boolean, default: false}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastLoginAt: {type: string, format: date-time, nullable: true}
        addresses:
          type: array
          items: {$ref: '#/components/schemas/Address'}

    BuyerProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - $ref: '#/components/schemas/BuyerPreferences'
        
    SellerProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - $ref: '#/components/schemas/Store'
        - $ref: '#/components/schemas/SellerSettings'    

    ProfileUpdateRequest:
      type: object
      properties:
        firstName: {type: string}
        lastName: {type: string}
        phone: {type: string}
        avatarUrl: {type: string}

    AdminProfile:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          adminRole: {$ref: '#/components/schemas/AdminRole'}
          lastLoginIp: {type: string, nullable: true}

    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - password
      properties:
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          format: password
          minLength: 8

      oneOf:
        - required:
            - email
          properties:
            email:
              type: string
              format: email

        - required:
            - phone
          properties:
            phone:
              type: string
              minLength: 10
              maxLength: 14

      description: >
        Public registration. Creates a buyer account only.
        Exactly one contact method must be provided: email or phone.
        Seller onboarding uses /auth/register/seller.
        Admin accounts are created through /admin/admins.
        
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        remember: {type: boolean, default: false}

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password}
        newPassword: {type: string, format: password, minLength: 8}

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}

    ChangeEmailRequest:
      type: object
      required: [newEmail, password]
      properties:
        newEmail: {type: string, format: email}
        password: {type: string, format: password}

    VerificationCodeRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, minLength: 4, maxLength: 10}

    Session:
      type: object
      properties:
        id: {type: string, format: uuid}
        device: {type: string}
        browser: {type: string}
        operatingSystem: {type: string}
        ipAddress: {type: string}
        location: {type: string, nullable: true}
        lastActiveAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        current: {type: boolean}

    SecuritySettings:
      type: object
      properties:
        twoFactorEnabled: {type: boolean}
        emailVerified: {type: boolean}
        phoneVerified: {type: boolean}
        passwordLastChangedAt: {type: string, format: date-time, nullable: true}
        lastLoginAt: {type: string, format: date-time, nullable: true}

    TwoFactorSetup:
      type: object
      properties:
        secret: {type: string}
        otpauthUrl: {type: string}
        qrCodeUrl: {type: string}

    RecoveryCodes:
      type: object
      properties:
        codes:
          type: array
          items: {type: string}

    PrivacySettings:
      type: object
      properties:
        profileVisibility: {type: string, enum: [private, public]}
        dataSharing: {type: boolean}

    ConsentSettings:
      type: object
      properties:
        marketing: {type: boolean}
        analytics: {type: boolean}
        personalization: {type: boolean}

    NotificationPrefs:
      type: object
      properties:
        orderCreated: {type: boolean, default: true}
        orderDelivered: {type: boolean, default: true}
        orderPending: {type: boolean, default: true}
        orderCancelled: {type: boolean, default: true}
        payment: {type: boolean, default: true}
        promotions: {type: boolean, default: true}
        priceDrops: {type: boolean, default: true}
        backInStock: {type: boolean, default: true}
        newProducts: {type: boolean, default: false}
        followedStores: {type: boolean, default: false}
        reviews: {type: boolean, default: true}
        recommendations: {type: boolean, default: true}
        email: {type: boolean, default: false}
        push: {type: boolean, default: true}
        sms: {type: boolean, default: false}
        frequency: {type: string, enum: [monthly, daily, weekly], default: monthly}

    Notification:
      type: object
      properties:
        id: {type: string, format: uuid}
        type:
          type: string
          enum: [order, payment, promotion, review, seller, system, security]
        title: {type: string}
        message: {type: string}
        data:
          type: object
          additionalProperties: true
        read: {type: boolean}
        createdAt: {type: string, format: date-time}


    Category:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        count: {type: integer}
        parentId: {type: string, format: uuid, nullable: true}
        children:
          type: array
          items: {$ref: '#/components/schemas/Category'}

    ProductSpecs:
      type: object
      additionalProperties: {type: string}

    ProductVariant:
      type: object
      properties:
        name: {type: string}
        values:
          type: array
          items: {type: string}

    Product:
      type: object
      required: [id, name, price, storeId, categoryId, stock]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        brand: {type: string, nullable: true}
        description: {type: string}
        price: {type: number, format: double}
        rating: {type: number, minimum: 0, maximum: 5}
        reviewsCount: {type: integer}
        storeId: {type: string, format: uuid}
        storeName: {type: string}
        categoryId: {type: string, format: uuid}
        categoryName: {type: string}
        lowStockThreshold: {type: integer, minimum: 0, default: 10}
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              isDefault:
                type: boolean
                default: false
        stock: {type: integer, minimum: 0}
        sku: {type: string}
        tags:
          type: array
          items: {type: string}
        specs: {$ref: '#/components/schemas/ProductSpecs'}
        variants:
          type: array
          items: {$ref: '#/components/schemas/ProductVariant'}
        status:
          $ref: "#/components/schemas/ProductStatus"
        moderationStatus:
          $ref: "#/components/schemas/ProductModerationStatus"
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        views: {type: integer, default: 0}
        soldCount: {type: integer, default: 0}
        wishlistCount: {type: integer, default: 0}

    ProductModerationStatus:
      type: string
      enum:
        - draft
        - pending
        - approved
        - rejected

    ProductStatus:
      type: string
      enum:
        - active
        - inactive

    ProductSummary:
      type: object
      required:
        - id
        - name
        - price
        - rating
        - reviewsCount
        - storeId
        - categoryId
        - status
        - images
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        brand:
          type: string
          nullable: true
        price:
          type: number
          format: double
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        reviewsCount:
          type: integer
          minimum: 0
        storeId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProductStatus"
        images:
          type: string
        createdAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string

    ProductInput:
      type: object
      required: [name, price, categoryId, stock]
      properties:
        name: {type: string}
        description: {type: string}
        brand: {type: string, nullable: true}
        categoryId: {type: string, format: uuid}
        tags:
          type: array
          items: {type: string}
        images:
          type: array
          items: {type: string, format: binary}
        price: {type: number, minimum: 0}
        stock: {type: integer, minimum: 0}
        specs:
          $ref: '#/components/schemas/ProductSpecs'
        variants:
          type: array
          items: {$ref: '#/components/schemas/ProductVariant'}
        status:
          type: string
          enum: [active, draft, inactive]
          default: draft

    Store:
      type: object
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        logoUrl: {type: string, nullable: true}
        coverUrl: {type: string, nullable: true}
        verified: {type: boolean}
        rating: {type: number, minimum: 0, maximum: 5}
        reviewsCount: {type: integer}
        productsCount: {type: integer}
        location: {type: string, nullable: true}
        joinedYear: {type: string}
        followersCount: {type: integer}
        description: {type: string, nullable: true}
        isOpen: {type: boolean}
        isFollowedByCurrentUser: {type: boolean}
        contact:
          type: object
          properties:
            phone: {type: string, nullable: true}
            email: {type: string, format: email, nullable: true}
            website: {type: string, nullable: true}

    BusinessHours:
      type: object
      additionalProperties:
        type: object
        properties:
          open: {type: string, example: '08:00'}
          close: {type: string, example: '17:00'}
          closed: {type: boolean}

    StorePolicies:
      type: object
      properties:
        returnPolicy: {type: string}
        refundPolicy: {type: string}
        cancellationPolicy: {type: string}
        privacyPolicy: {type: string}

    StoreSettings:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        logoUrl: {type: string, nullable: true}
        coverUrl: {type: string, nullable: true}
        location: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        vacationMode: {type: boolean}
        businessHours: {$ref: '#/components/schemas/BusinessHours'}
        socialLinks:
          type: object
          properties:
            facebook: {type: string, nullable: true}
            instagram: {type: string, nullable: true}
            website: {type: string, nullable: true}
        policies: {$ref: '#/components/schemas/StorePolicies'}

    Review:
      type: object
      properties:
        id: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        productName: {type: string}
        storeId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        customerName: {type: string}
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string}
        date: {type: string, format: date-time}
        replied: {type: boolean}
        reply: {type: string, nullable: true}
        replyDate: {type: string, format: date-time, nullable: true}
        productImage:
          type: string
          nullable: true
        verifiedPurchase:
          type: boolean
        helpfulCount:
          type: integer
        status: {type: string, enum: [published, hidden, pending]}
    ReviewInput:
      type: object
      required: [rating, comment]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string, minLength: 1}

    BuyerPreferences:
      type: object
      properties:
        theme: {$ref: '#/components/schemas/Theme'}
        lang: {$ref: '#/components/schemas/Lang'}
        favoriteCategories:
          type: array
          items: {type: string, format: uuid}
        preferredDeliveryMethod:
          type: string
          enum: [standard, express, pickup]
        personalizedRecommendations: {type: boolean}
        showRecentlyViewed: {type: boolean}
        notifications: {$ref: '#/components/schemas/NotificationPrefs'}

    PaymentMethod:
      type: object
      properties:
        id: {type: string, format: uuid}
        type:
          type: string
          enum: [card, mvola, orange_money]
        provider: {type: string, nullable: true}
        label: {type: string, nullable: true}
        last4: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        isDefault: {type: boolean}
        createdAt: {type: string, format: date-time}
        verified: {type: boolean}
        expired: {type: boolean}

    AddPaymentMethodRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [card, mvola, orange_money]
        token: {type: string, nullable: true, description: Payment provider token. Never send raw card data to Nova 
            Market.}
        phone: {type: string, nullable: true}
        isDefault: {type: boolean, default: false}

    CartItem:
      type: object
      properties:
        productId: {type: string, format: uuid}
        name: {type: string}
        image: {type: string}
        price: {type: number}
        qty: {type: integer}
        sellerId: {type: string, format: uuid}
        sellerName: {type: string}
        stock: {type: integer}
        originalPrice: {type: number, nullable: true}
        discount: {type: number, nullable: true}
        subtotal: {type: number}

    CartItemInput:
      type: object
      required: [productId, qty]
      properties:
        productId: {type: string, format: uuid}
        qty: {type: integer, minimum: 1}

    CartItemUpdate:
      type: object
      required: [qty]
      properties:
        qty: {type: integer, minimum: 0}

    Cart:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CartItem'}
        subtotal: {type: number}
        itemsCount: {type: integer}

    OrderItem:
      type: object
      properties:
        productId: {type: string, format: uuid}
        productName: {type: string}
        image: {type: string}
        price: {type: number}
        qty: {type: integer}
        sellerId: {type: string, format: uuid}
        sellerName: {type: string}

    OrderStatus:
      type: string
      enum: [pending, confirmed, processing, preparing, delivered, cancelled]

    PaymentStatus:
      type: string
      enum: [pending, paid, failed, refunded, partially_refunded]

    Order:
      type: object
      properties:
        id: {type: string, example: ORD-2026-001}
        buyerId: {type: string, format: uuid}
        buyerName: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        sellers:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
        subtotal: {type: number}
        deliveryFee: {type: number}
        total: {type: number}
        status: {$ref: '#/components/schemas/OrderStatus'}
        deliveryMethod: {type: string, enum: [standard, express, pickup]}
        paymentMethod: {type: string, enum: [mvola, orange_money, card, cod]}
        paymentStatus: {$ref: '#/components/schemas/PaymentStatus'}
        address: {$ref: '#/components/schemas/Address'}
        tracking:
          type: array
          items: {$ref: '#/components/schemas/TrackingPoint'}
        estimatedDelivery: {type: string, format: date-time, nullable: true}
        note: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        cancelReason: {type: string, nullable: true}
        deliveryTracking:
          $ref: '#/components/schemas/DeliveryTracking'
        deliveryId:
          type: string
          format: uuid
          nullable: true

    CheckoutRequest:
      type: object
      required: [deliveryMethod, paymentMethod]
      properties:
        addressId: {type: string, format: uuid, nullable: true}
        newAddress: {$ref: '#/components/schemas/Address'}
        deliveryMethod: {type: string, enum: [standard, express, pickup]}
        paymentMethod: {type: string, enum: [mvola, orange_money, card, cod]}
        paymentMethodId: {type: string, format: uuid, nullable: true}
        paymentPhoneNumber: {type: string, nullable: true}
        note: {type: string, nullable: true}

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/OrderStatus'}
        tracking: {type: string, nullable: true}

    VerificationDocument:
      type: object
      properties:
        id: {type: string, format: uuid}
        type:
          type: string
          enum: [identity, business_registration, tax_document, bank_account]
        status: {type: string, enum: [pending, approved, rejected]}
        fileUrl: {type: string, nullable: true}
        uploadedAt: {type: string, format: date-time}
        rejectionReason: {type: string, nullable: true}

    SellerApplication:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        submittedAt: {type: string, format: date-time, nullable: true}
        verifiedAt: {type: string, format: date-time, nullable: true}
        comments: {type: string, nullable: true}
        store:
          type: object
          properties:
            name: {type: string}
            location: {type: string}
            businessType:
              type: string
              enum:
              - individual
              - company
            taxId: {type: string}
            registrationNumber: {type: string}
        documents:
          type: array
          items: {$ref: '#/components/schemas/VerificationDocument'}
        approvedAt:
          type: string
          format: date-time
          nullable: true
        approvedByAdminId:
          type: string
          format: uuid
          nullable: true
        rejectionReason:
          type: string
          nullable: true

    SellerApplicationReview:
      type: object
      properties:
        action: {type: string, enum: [approved, rejected]}
        reason: {type: string, nullable: true}
      required:
      - action

    SellerNotificationPrefs:
      type: object
      properties:
        newOrder: {type: boolean, default: true}
        orderCancelled: {type: boolean, default: true}
        lowStock: {type: boolean, default: true}
        productApproved: {type: boolean, default: true}
        productRejected: {type: boolean, default: true}
        newReview: {type: boolean, default: true}
        payout: {type: boolean, default: true}
        sellerAnnouncements: {type: boolean, default: true}
        email: {type: boolean, default: true}
        push: {type: boolean, default: true}
        sms: {type: boolean, default: false}

    SellerSettings:
      type: object
      properties:
        theme: {$ref: '#/components/schemas/Theme'}
        lang: {$ref: '#/components/schemas/Lang'}
        notifications: {$ref: '#/components/schemas/SellerNotificationPrefs'}

    SellerBalance:
      type: object
      properties:
        available: {type: number}
        pending: {type: number}
        totalEarned: {type: number}
        totalPaidOut: {type: number}

    SellerPayoutMethod:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [mvola, orange_money, bank_account]}

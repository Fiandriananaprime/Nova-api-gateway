        '200':
          description: Category
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '404': {$ref: '#/components/responses/NotFound'}

  /products:
    get:
      tags: [Catalog]
      summary: Search and filter products
      security: []
      parameters:
      - {$ref: '#/components/parameters/SearchParam'}
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/LimitParam'}
      - name: category
        in: query
        schema: {type: string}
      - name: minPrice
        in: query
        schema: {type: number}
      - name: maxPrice
        in: query
        schema: {type: number}
      - name: minRating
        in: query
        schema: {type: number, minimum: 0, maximum: 5}
      - name: onSale
        in: query
        schema: {type: boolean}
      - name: sort
        in: query
        schema:
          type: string
          enum: [relevance, price_asc, price_desc, rating, newest,popularity]
          default: relevance
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ProductSummary'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}


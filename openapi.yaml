        name: {type: string}
        email: {type: string, format: email}
        avatarInitial: {type: string}
        ordersCount: {type: integer}
        totalSpent: {type: number}
        lastOrderDate: {type: string, format: date, nullable: true}
        status: {type: string, enum: [active, inactive]}

    AdminMetrics:
      type: object
      properties:
        totalRevenue: {type: number}
        totalOrders: {type: integer}
        totalBuyers: {type: integer}
        totalSellers: {type: integer}
        totalProducts: {type: integer}
        pendingApplications: {type: integer}
        pendingProducts: {type: integer}

    AdminRevenuePoint:
      type: object
      properties:
        day: {type: string, format: date}
        revenue: {type: number}
        sellers: {type: integer}
        buyers: {type: integer}

    AdminDashboard:
      type: object
      properties:
        metrics: {$ref: '#/components/schemas/AdminMetrics'}
